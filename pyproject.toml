[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "atomic-povray"
version = "0.2.0"
description = "Reproducible rendering of ASE atomic structures with POV-Ray"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0-or-later"}
dependencies = [
    "ase>=3.23",
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
test = ["pytest>=8"]
notebook = ["jupyterlab>=4"]

[tool.hatch.build.targets.wheel]
packages = ["src/atomic_povray"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
